<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  
  <g transform="translate(150, 165) scale(3)">
    <!-- Left Page -->
    <path d="M 50 85 C 40 85, 20 80, 15 75 L 15 25 C 20 30, 40 35, 50 35 Z" fill="#ffffff" filter="url(#shadow)" />
    <!-- Right Page -->
    <path d="M 50 85 C 60 85, 80 80, 85 75 L 85 25 C 80 30, 60 35, 50 35 Z" fill="#f8fafc" filter="url(#shadow)" />

    <!-- Subtle Page Lines (Left) -->
    <path d="M 22 42 Q 35 48 45 48" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 22 52 Q 35 58 45 58" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 22 62 Q 35 68 45 68" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Subtle Page Lines (Right) -->
    <path d="M 78 42 Q 65 48 55 48" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 78 52 Q 65 58 55 58" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 78 62 Q 65 68 55 68" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Center bookmark/spine line -->
    <line x1="50" y1="35" x2="50" y2="85" stroke="#94a3b8" stroke-width="2" />
    
    <!-- Overlay Cross in Gold -->
    <g fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
      <line x1="50" y1="15" x2="50" y2="55" />
      <line x1="40" y1="30" x2="60" y2="30" />
    </g>
  </g>

  <!-- Title Text -->
  <text x="520" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="bold" fill="#ffffff">Catechism App</text>
  <text x="520" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="300" fill="#94a3b8">Explore and study the faith</text>
</svg>